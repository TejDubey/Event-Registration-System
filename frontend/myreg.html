<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Registrations</title>

    <link rel="stylesheet" href="myreg.css">

    <link rel="icon" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>My Registration</h1>

        <div class="row">
            <i class="fa-solid fa-user"></i>
            <span class="label">Name</span>
            <span id="name"></span>
        </div>

        <div class="row">
            <i class="fa-solid fa-envelope"></i>
            <span class="label">Email</span>
            <span id="email"></span>
        </div>

        <div class="row">
            <i class="fa-solid fa-venus-mars"></i>
            <span class="label">Gender</span>
            <span id="gender"></span>
        </div>

        <div class="row">
            <i class="fa-solid fa-calendar"></i>
            <span class="label">Event</span>
            <span id="event"></span>
        </div>

        <div class="row">
            <i class="fa-solid fa-heart"></i>
            <span class="label">Interests</span>
            <span id="interests"></span>
        </div>

        <div class="row">
            <i class="fa-solid fa-star"></i>
            <span class="label">Excitement</span>
            <span id="excitement"></span>
        </div>

        <div class="reason">

            <h3>Reason for Joining</h3>

            <p id="reason"></p>

        </div>

        <button id="backBtn">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Dashboard

        </button>

    </div>

</div>

<script src="myreg.js"></script>

</body>
</html>
